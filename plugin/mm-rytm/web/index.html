<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MM-RYTM</title>
    <!-- La face du plugin (2026-11-08) : posee avant tout module (src/v4/theme/base.ts PLUGIN, PORTRAIT) -->
    <script>
      window.__MM_PLUGIN__ = true;
    </script>
    <style>
      @font-face {
        font-family: 'Robot Radicals';
        src: url('/fonts/RobotRadicals.woff2') format('woff2');
        font-display: block;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF-Pro-Display-Regular.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF-Pro-Display-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF-Pro-Display-Semibold.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF-Pro-Display-Bold.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'SF Pro Display';
        src: url('/fonts/SF-Pro-Display-Black.woff2') format('woff2');
        font-weight: 900;
      }
      /* La face v3 (2026-11-25) : les grands noms et chiffres des ecrans en points (Doto 'MM Dots', comme le MM-ARP). Sans le
         point (U+002E) : celui de Doto se lit "+" ; il retombe sur SF Pro */
      @font-face {
        font-family: 'MM Dots';
        src: url('/fonts/Doto-800.woff2') format('woff2');
        font-weight: 800;
        unicode-range: U+0020-002D, U+002F-00FF;
        font-display: block;
      }
      @font-face {
        font-family: 'MM Dots';
        src: url('/fonts/Doto-900.woff2') format('woff2');
        font-weight: 900;
        unicode-range: U+0020-002D, U+002F-00FF;
        font-display: block;
      }
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0b0c;
        user-select: none;
        -webkit-user-select: none;
      }
      .mm-plugin-error {
        position: fixed;
        left: 12px;
        bottom: 8px;
        margin: 0;
        color: #ff6a13;
        font: 12px ui-monospace, Menlo, monospace;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/v4/plugin/main.tsx"></script>
  </body>
</html>
