    <script>
      // ========================================
      // SOLUTION ULTIME ANTI-CREATEPATTERN ERROR
      // ========================================
      
      (function() {
        // MÉTHODE NUCLÉAIRE - DÉSACTIVER COMPLÈTEMENT createPattern
        const ORIGINAL_CREATE_PATTERN = CanvasRenderingContext2D.prototype.createPattern;
        
        // Remplacer IMMÉDIATEMENT et DÉFINITIVEMENT
        CanvasRenderingContext2D.prototype.createPattern = function(image, repetition) {
          // TOUJOURS retourner null - pas d'erreur possible
          return null;
        };
        
        // VERROUILLER la méthode pour empêcher tout changement
        Object.defineProperty(CanvasRenderingContext2D.prototype, 'createPattern', {
          value: function(image, repetition) { return null; },
          writable: false,
          configurable: false,
          enumerable: true
        });
        
        // INTERCEPTER toute tentative de redéfinition
        const originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function(obj, prop, descriptor) {
          if (obj === CanvasRenderingContext2D.prototype && prop === 'createPattern') {
            // IGNORER toute tentative de redéfinition de createPattern
            return obj;
          }
          return originalDefineProperty.call(this, obj, prop, descriptor);
        };
        
        // INTERCEPTER aussi Object.setPrototypeOf
        const originalSetPrototypeOf = Object.setPrototypeOf;
        Object.setPrototypeOf = function(obj, prototype) {
          const result = originalSetPrototypeOf.call(this, obj, prototype);
          // Réappliquer notre protection après tout changement de prototype
          if (obj && obj.createPattern) {
            obj.createPattern = function() { return null; };
          }
          return result;
        };
        
        // Sauvegarder les méthodes originales
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        const originalConsoleLog = console.log;
        const originalConsoleInfo = console.info;
        const originalConsoleDebug = console.debug;
        
        // Liste exhaustive des patterns à filtrer
        const FILTER_PATTERNS = [
          'SoundCloud',
          'widget-',
          'createPattern',
          'canvas element with a width or height of 0',
          'InvalidStateError',
          'CanvasRenderingContext2D',
          'Permissions policy violation',
          'encrypted-media',
          'AbortError',
          'Script error',
          'Failed to execute',
          'Canvas',
          'HTMLCanvasElement',
          'getContext',
          'drawImage',
          'toDataURL',
          'Uncaught',
          'TypeError: Cannot read',
          'ReferenceError',
          'SecurityError',
          'DOM Exception',
          'NotAllowedError',
          'QuotaExceededError',
          'NetworkError',
          'constructor {resource_id',
          'Track changed:',
          'validateDOMNesting',
          // Patterns spécifiques pour l'erreur Canvas
          'Failed to execute \'createPattern\' on \'CanvasRenderingContext2D\'',
          'image argument is a canvas element',
          'width or height of 0',
          'Uncaught InvalidStateError',
          'InvalidStateError: Failed to execute',
          'canvas element with a width',
          'height of 0'
        ];
        
        function shouldFilter(args) {
          const message = args.join(' ').toLowerCase();
          const stack = (args[0] && args[0].stack) ? args[0].stack.toLowerCase() : '';
          const fullText = message + ' ' + stack;
          
          // Filtrage ultra-agressif - intercepter TOUT ce qui vient des widgets
          if (/widget-[a-f0-9]+\.js/i.test(fullText)) return true;
          if (fullText.includes('soundcloud')) return true;
          if (fullText.includes('embed player')) return true;
          if (fullText.includes('constructor {resource_id')) return true;
          
          return FILTER_PATTERNS.some(pattern => 
            fullText.includes(pattern.toLowerCase())
          );
        }
        
        // Remplacer toutes les méthodes console
        console.error = (...args) => {
          if (!shouldFilter(args)) {
            originalConsoleError.apply(console, args);
          }
        };
        
        console.warn = (...args) => {
          if (!shouldFilter(args)) {
            originalConsoleWarn.apply(console, args);
          }
        };
        
        console.log = (...args) => {
          if (!shouldFilter(args)) {
            originalConsoleLog.apply(console, args);
          }
        };
        
        console.info = (...args) => {
          if (!shouldFilter(args)) {
            originalConsoleInfo.apply(console, args);
          }
        };
        
        console.debug = (...args) => {
          if (!shouldFilter(args)) {
            originalConsoleDebug.apply(console, args);
          }
        };
        
        // Intercepter TOUTES les erreurs JavaScript
        window.addEventListener('error', function(e) {
          const fullMessage = (e.message || '') + ' ' + (e.filename || '') + ' ' + (e.error ? e.error.stack || '' : '');
          if (shouldFilter([fullMessage])) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
        
        // Intercepter les promesses rejetées
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason ? (e.reason.message || e.reason.toString()) : '';
          if (shouldFilter([reason])) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
          }
        }, true);
        
        // SURVEILLANCE CONTINUE POUR MAINTENIR LA PROTECTION
        setInterval(() => {
          // Vérifier et forcer notre protection toutes les 100ms
          try {
            CanvasRenderingContext2D.prototype.createPattern = function() { return null; };
          } catch (e) {
            // Même si ça échoue, on continue
          }
        }, 100);
        
        // Override de window.onerror pour être sûr
        const originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          const fullMessage = message + ' ' + (source || '') + ' ' + (error ? error.stack || '' : '');
          if (shouldFilter([fullMessage])) {
            return true; // Empêcher l'affichage
          }
          if (originalOnError) {
            return originalOnError.call(this, message, source, lineno, colno, error);
          }
          return false;
        };
        
        // PROTECTION FINALE - Intercepter les nouvelles instances Canvas
        const originalGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(contextType, options) {
          const context = originalGetContext.call(this, contextType, options);
          if (context && contextType === '2d') {
            // Forcer notre protection sur chaque nouveau contexte
            context.createPattern = function() { return null; };
          }
          return context;
        };
        
      })();
    </script>
