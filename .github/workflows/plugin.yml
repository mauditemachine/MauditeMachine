name: Plugin MM-RYTM
# 2026-11-08 (Mika : "extrais le code de Rytm pour en faire un plugin VST3", usage perso) : le portage C++ du MM-RYTM
# (plugin/mm-rytm). 1) le DSP compare au vrai shotsdsp.ts du site, sur Linux ; 2) le VST3 macOS universel, signe
# ad hoc, en artefact a telecharger (2026-11-08, Mika : "je veux juste vst 3"). Rien ne touche au site ni a GitHub Pages.
on:
  push:
    paths:
      - 'plugin/**'
      - 'public/samples/rytm/**'
      - 'src/v4/audio/shotsdsp.ts'
      - 'src/v4/audio/sampledsp.ts'
      - 'src/v4/audio/stretch.ts'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dsp:
    name: DSP identique au site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire le DSP et ses tests (sans JUCE)
        run: |
          cmake -S plugin/mm-rytm -B build-dsp -DMM_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dsp -j
      - name: Moteur (voix, choke, multi-out, sequenceur)
        run: ./build-dsp/mm_engine_test
      - name: Comparaison au shotsdsp.ts du site
        run: |
          node plugin/mm-rytm/tests/render-ref.mjs ref
          ./build-dsp/mm_compare ref public/samples/rytm

  mac:
    name: Plugin macOS (VST3)
    needs: dsp
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurer (universel arm64 + x86_64)
        run: cmake -S plugin/mm-rytm -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Construire
        run: cmake --build build --config Release -j 4 --target MM_RYTM_VST3
      # Le paquet dans pkg/, jamais dans dist/ : dist/ est le build du site commite dans le repo (886 fichiers), le
      # premier artefact l'embarquait en entier (404 Mo)
      - name: Signer ad hoc et empaqueter
        run: |
          rm -rf pkg && mkdir -p pkg/MM-RYTM
          B=build/MM_RYTM_artefacts/Release/VST3/MM-RYTM.vst3
          codesign --force --deep --sign - "$B"
          codesign --verify --deep --strict "$B"
          ditto "$B" pkg/MM-RYTM/MM-RYTM.vst3
          cp plugin/mm-rytm/INSTALL.md pkg/MM-RYTM/
          ditto -c -k --keepParent pkg/MM-RYTM MM-RYTM-macOS.zip
          unzip -l MM-RYTM-macOS.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: MM-RYTM-macOS
          path: MM-RYTM-macOS.zip
          retention-days: 30
