name: Plugin MM-RYTM
# 2026-11-08 (Mika : "extrais le code de Rytm pour en faire un plugin VST3", usage perso) : le portage C++ du MM-RYTM
# (plugin/mm-rytm). 1) le DSP compare au vrai shotsdsp.ts du site, sur Linux ; 2) le VST3 macOS universel, signe
# ad hoc, en artefact a telecharger (2026-11-08, Mika : "je veux juste vst 3"). Rien ne touche au site ni a GitHub Pages.
on:
  push:
    paths:
      - 'plugin/**'
      - 'public/samples/rytm/**'
      - 'src/v4/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dsp:
    name: DSP identique au site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire le DSP et ses tests (sans JUCE)
        run: |
          cmake -S plugin/mm-rytm -B build-dsp -DMM_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dsp -j
      - name: Moteur (voix, choke, multi-out, sequenceur)
        run: ./build-dsp/mm_engine_test
      - name: Comparaison au shotsdsp.ts du site
        run: |
          node plugin/mm-rytm/tests/render-ref.mjs ref
          ./build-dsp/mm_compare ref public/samples/rytm

  mac:
    name: Plugin macOS (VST3)
    needs: dsp
    runs-on: macos-latest
    # La release mm-rytm-latest (ci-dessous) : le seul droit d'ecriture du workflow
    permissions:
      contents: write
    steps:
      # L'historique (sans les fichiers) : la date du dernier changement du plugin decide de la publication (ci-dessous)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      # La face (2026-11-08) : la machine du site (src/v4/plugin), construite puis embarquee dans le VST3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Construire la face
        run: |
          npm ci --no-audit --no-fund
          npm run plugin:web
      - name: Configurer (universel arm64 + x86_64)
        run: cmake -S plugin/mm-rytm -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Construire
        run: cmake --build build --config Release -j 4 --target MM_RYTM_VST3
      # Le paquet dans pkg/, jamais dans dist/ : dist/ est le build du site commite dans le repo (886 fichiers), le
      # premier artefact l'embarquait en entier (404 Mo)
      - name: Signer ad hoc et empaqueter
        run: |
          rm -rf pkg && mkdir -p pkg/MM-RYTM
          B=build/MM_RYTM_artefacts/Release/VST3/MM-RYTM.vst3
          codesign --force --deep --sign - "$B"
          codesign --verify --deep --strict "$B"
          ditto "$B" pkg/MM-RYTM/MM-RYTM.vst3
          cp plugin/mm-rytm/INSTALL.md plugin/mm-rytm/update.sh pkg/MM-RYTM/
          printf 'commit %s, branche %s, %s\n' "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$(date -u '+%Y-%m-%d %H:%M UTC')" > pkg/MM-RYTM/BUILD.txt
          ditto -c -k --keepParent pkg/MM-RYTM MM-RYTM-macOS.zip
          unzip -l MM-RYTM-macOS.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: MM-RYTM-macOS
          path: MM-RYTM-macOS.zip
          retention-days: 30
      # 2026-11-08 (Mika : "vas-y pour la release") : le dernier build aussi en release mm-rytm-latest, a une adresse fixe
      # sans compte GitHub ; plugin/mm-rytm/update.sh (publie avec) le telecharge et l'installe par-dessus l'ancien. La
      # release suit le dernier build vert : ses fichiers sont remplaces, son etiquette avance au commit construit.
      - name: Publier le dernier build (release mm-rytm-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 2026-11-09 : d'autres branches (le site, le MM-ARP) font aussi tourner ce workflow avec un plugin plus ancien ;
          # la release ne prend un build que si le plugin y est au moins aussi recent (la date du dernier commit qui touche
          # plugin/mm-rytm ou src/v4/plugin, gardee dans ses notes : plugin-time)
          T=$(git log -1 --format=%ct -- plugin/mm-rytm src/v4/plugin)
          CUR=$(gh release view mm-rytm-latest --json body -q .body 2>/dev/null | sed -n 's/.*plugin-time \([0-9]*\).*/\1/p')
          if [ -n "$CUR" ] && [ -n "$T" ] && [ "$T" -lt "$CUR" ]; then
            echo "La release a un plugin plus recent (plugin-time $CUR > $T) : pas de publication."
            exit 0
          fi
          if ! gh release view mm-rytm-latest >/dev/null 2>&1; then
            gh release create mm-rytm-latest --prerelease --target "$GITHUB_SHA" --title "MM-RYTM (dernier build)" --notes "Le VST3 macOS du dernier build."
          fi
          gh release upload mm-rytm-latest MM-RYTM-macOS.zip plugin/mm-rytm/update.sh --clobber
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/mm-rytm-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit mm-rytm-latest --notes "MM-RYTM, le VST3 macOS (universel, signe ad hoc) du commit ${GITHUB_SHA::7}, branche ${GITHUB_REF_NAME} (plugin-time ${T}). Usage perso. Pour l'installer par-dessus l'ancien, dans le Terminal : curl -fsSL https://github.com/${GH_REPO}/releases/download/mm-rytm-latest/update.sh | bash"
