<!doctype html>
<!--
  Image d'apercu des liens (Open Graph, 1200 x 630), 2026-10-01 : la photo
  de scene du press kit 2027 (la salle pleine), assombrie, le logo
  MAUDITE MACHINE en blanc, VRSTL Records et les deux adresses dessous, la
  mise en page de l'ancienne image. Rendu : docs/og-image/build.sh.
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'DIN';
    src: url('../../public/fonts/DIN Alternate Bold.ttf');
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  .bg {
    position: absolute; inset: 0;
    background: url('../presskit-2027/photos/stage-crowd.jpg') center 45% / cover no-repeat;
  }
  /* la scene se lit encore, le logo d'abord : voile, puis plus sombre en bas pour les adresses */
  .veil {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.2)),
      linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 55%, rgba(0, 0, 0, 0.7));
  }
  .logo {
    position: absolute; left: 50%; top: 218px; width: 820px; transform: translateX(-50%);
    filter: brightness(0) invert(1) drop-shadow(0 4px 24px rgba(0, 0, 0, 0.45));
  }
  .label {
    position: absolute; left: 50%; top: 478px; width: 190px; transform: translateX(-50%);
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.5));
  }
  .urls {
    position: absolute; left: 0; right: 0; top: 578px; text-align: center;
    font: 26px 'DIN', sans-serif; color: #fff; word-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  .urls span + span { margin-left: 34px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <img class="logo" src="../../public/logo/LogoStack.svg" alt="" />
  <img class="label" src="../../public/logo/vrstl-logo.png" alt="" />
  <div class="urls"><span>mauditemachine.com</span><span>vrstlrecords.com</span></div>
</body>
</html>
