    <script>
      // Supprimer les logs verbeux de SoundCloud et Canvas
      const originalConsoleError = console.error;
      const originalConsoleWarn = console.warn;
      const originalConsoleLog = console.log;
      
      console.error = (...args) => {
        const message = args.join(' ');
        if (message.includes('SoundCloud') || 
            message.includes('widget-') || 
            message.includes('createPattern') ||
            message.includes('canvas element with a width or height of 0') ||
            message.includes('InvalidStateError') ||
            message.includes('CanvasRenderingContext2D')) {
          return; // Ignore SoundCloud/Canvas errors
        }
        originalConsoleError.apply(console, args);
      };
      
      console.warn = (...args) => {
        const message = args.join(' ');
        if (message.includes('SoundCloud') || 
            message.includes('widget-') ||
            message.includes('validateDOMNesting')) {
          return; // Ignore SoundCloud warnings et DOM nesting
        }
        originalConsoleWarn.apply(console, args);
      };
      
      console.log = (...args) => {
        const message = args.join(' ');
        if (message.includes('SoundCloud Embed Player') || 
            message.includes('constructor {resource_id') ||
            message.includes('Track changed:')) {
          return; // Ignore SoundCloud logs
        }
        originalConsoleLog.apply(console, args);
      };
    </script>
