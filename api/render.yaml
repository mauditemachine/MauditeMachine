services:
  - type: web
    name: mauditemachine-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: mauditemachine/MauditeMachine
      - key: ADMIN_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://mauditemachine.com
